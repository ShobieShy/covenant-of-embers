ai = { kind = "filth", detect_range = 16.0, aggro_range = 12.0, walk_speed = 1.0, sprint_speed = 2.0, attack_range = 2.2, attack_damage = 10.0, attack_cooldown = 2.4, attack_windup = 0.7, knockback_strength = 15.0, knockback_time = 0.2, knockback_threshold = 60.0, turn_rate_deg = 90.0 }
