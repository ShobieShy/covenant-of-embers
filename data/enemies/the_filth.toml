# The Filth (BUILD_PLAN steps 56-57, Q8): the Landfill's three-phase slime boss; it replaces
# the old Heap push wave as the Midden's ending. ai kind "filth" = scripts/enemies/filth.gd
# (a Heap: same slam + wind-up; plus acid blobs, phase-2 regen from debris, phase-3 exposed
# core). Magewar reference: boss_the_filth (acid, regenerates from debris; no numbers).
# Plan design: 900 HP = three 300 HP phases; with the starter Apprentice Fire Staff (15 per
# bolt) that's 20 bolts a phase, ~20-35 s at a realistic hit rate while dodging (Q8).
# Earth (the Water-weak element, step 59 status: stagger). Always drops Joe's Trash.

