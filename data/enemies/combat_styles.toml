# 0.8.3 combat styles (issue #24). One row per enemy that has a brain.
# `patterns` names the strikes that enemy already has or gains here. The Gnawer
# brain still does the opening rush at the authored speeds. Strafe, retreat and
# dodge run in the pocket. `special` is the second strike (lunge, cleave, fan).
# `feint` adds no extra hit: bosses keep the phase attacks they already have.
# `arm_s` is how long a fight lasts before that second strike can wind up, so a
# short exchange is still the basic attack.

[[style]]
id = "gnawer"
patterns = ["snap", "lunge"]
special = "lunge"
strafe_speed = 2.2
strafe_period = 0.85
retreat_speed = 1.8
retreat_s = 0.28
dodge_speed = 3.4
dodge_s = 0.16
arm_s = 8.0
windup = 0.32
lunge_speed = 8.0
damage_mul = 1.35
cooldown = 3.2
recover = 0.2

