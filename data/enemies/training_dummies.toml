# Enemy types (BUILD_PLAN step 11, PLAN §30.4): training dummies for the damage formula.
# Loaded by scripts/enemies/enemy_def.gd (EnemyDef.from_toml); placed in a level with [[enemy]] (data/levels/*.toml).
# Magewar has no enemy health values (scripts/enemies/enemy_base.gd only wires a
# CogitoHealthAttribute), so the numbers here are plan design: 60 HP = exactly four
# Apprentice Fire Staff bolts (10 x 1.5) on the Earth dummy.
#
# [[enemy]] -- all keys required unless marked optional:
#   id          lower_snake_case, unique
#   name        display name
#   affinity    defender element for the effectiveness chart (data/magic/elements.toml):
#               arcane | fire | water | earth | air | light | dark
#   max_health  starting health, 1..100000
#   level       optional Magewar enemy_level 1..50 (default 1; step 18: +1 procedural part at >= 3)
#   size        [x, y, z] body hitbox full extents in metres; the box stands on the feet
#   color       [r, g, b] greybox tint in 0..1 (the weak point draws brighter)
#   resist      optional { <element> = 0..1, ... } incoming-element resistance
#               (damage x (1 - resist); applied capped at 60 %)
#   weak_point  optional { offset = [x, y, z] centre from the feet, size = [x, y, z] }
#               a separate hitbox taking x2 damage (the Heap seam uses the same)
#   ai          optional (step 12) brain; omitted = a dummy that never moves.
#               { kind = "rusher" | "tank" (required; tank = the Heap), detect_range, aggro_range (<= detect),
#                 walk_speed, sprint_speed, attack_range (> half the body + 0.3),
#                 attack_damage, attack_cooldown, knockback_strength, knockback_time,
#                 knockback_threshold, turn_rate_deg, attack_windup (< cooldown;
#                 0 = instant, the tank plants and slams after it) } -- unset keys take Magewar
#               enemy_base.gd's defaults (15 / 10 m, 2 / 4 m/s, 5 dmg per 1.5 s,
#               knockback 10 m/s for 0.5 s on hits over 10), attack_range 1 m, 540 deg/s.

[[enemy]]
id = "earth_training_dummy"
name = "Earthen Training Dummy"
affinity = "earth"
max_health = 60
size = [0.7, 1.6, 0.7]
color = [0.5, 0.35, 0.1]      # Earth's element colour
weak_point = { offset = [0.0, 1.78, 0.0], size = [0.36, 0.36, 0.36] }

[[enemy]]
id = "water_training_dummy"
name = "Tidal Training Dummy"
affinity = "water"
max_health = 60
size = [0.7, 1.6, 0.7]
color = [0.1, 0.4, 1.0]       # Water's element colour
resist = { air = 0.25 }
weak_point = { offset = [0.0, 1.78, 0.0], size = [0.36, 0.36, 0.36] }
