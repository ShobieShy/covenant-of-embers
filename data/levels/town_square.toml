# Eldoria Town Square, 0.11.1. A hub ring about 320 m across. The paved
# square is 120 m and sits at y 2, with roads north, south, and east.
# The west arc is a cliff. Grass, hills, a shallow moat, and rock
# outcrops are the Terrain3D ground. Kenney rock-large stands in for
# the Ember Art cliff mesh. The dome is the sky.

