# The Breach - first dungeon room slice (BUILD_PLAN step 33). Same format as
# midden_greybox.toml (see its header); generated into scenes/levels/breach.tscn.
#
# Layout (PLAN: a Breach is a dungeon room with a boss and a vault): a 4 m wide entrance
# corridor from the south, a 24 x 24 m arena with four pillars for cover and a boss dais in
# the north half, and a vault room behind a 4 m wide vault door in the north wall. The
# vault door is a wall box named "vault_door"; step 35 opens it (Vault) when the boss dies.
# Magewar has no dungeon room (its boss fights in the landfill ring); the scale follows the
# Midden's 4 m walls and 4 m entrance.
#
# Step 47 layout pass (PLAN §14 room order, walking north from the entrance):
#   entrance hall (z 69..77: start, Assembly Station, gate back to the Midden)
#   -> room 1 "gnawer den" (z 57..69) -> room 2 "ember gallery" (z 45..57, Scorchlings)
#   -> room 3 "mire cistern" (z 33..45, Ooze) -> switch room (z 23..33: two levers open
#   the "switch_gate" into the corridor; they stay inert until every room encounter is
#   cleared) -> corridor -> arena (mini-boss wave: the Heap; then the Warden boss)
#   -> vault. Rooms are 14 x 12 m with 4 m doorways on the centre line and some cover.

[level]
id = "breach_slice"
name = "The Breach"

[materials]                  # step 75 art pass: CC0 ambientCG sets, tinted by each box colour
ground = "assets/ambientcg/PavingStones131"
wall = "assets/ambientcg/Bricks076C"
crate = "assets/ambientcg/Wood049"
heap = "assets/ambientcg/Rock030"
platform = "assets/ambientcg/Rock030"
ramp = "assets/ambientcg/Rock030"
uv_scale = 0.4

[environment]
sky_color = [0.16, 0.12, 0.14]
ambient_color = [0.22, 0.18, 0.18]
fog_density = 0.01
sky = true                          # step 124 (Art A6): procedural sky
volumetric_fog = 0.025               # step 132 (FX F6): violet-grey Breach haze (off on Low)
fog_albedo = [0.5, 0.45, 0.6]
grade = [0.97, 1.12, 0.88]          # step 132: brightness, contrast, saturation

[sun]
to_light = [0.3, 0.8, 0.5]
color = [0.75, 0.6, 0.55]

