trigger_center = [0.0, 0.0, 6.0]
trigger_radius = 4.0

[[spawn_point]]
name = "boss_dais"            # on the 0.2 m dais (under the 0.25 m nav climb); step 34's mini-boss stands here
position = [0.0, 0.2, -7.0]
yaw_deg = 180.0

[[spawn_point]]
name = "west_wing"
position = [-9.0, 0.0, 0.0]
yaw_deg = -90.0

[[spawn_point]]
name = "east_wing"
position = [9.0, 0.0, 0.0]
yaw_deg = 90.0

[[spawn_point]]
name = "station"              # step 46/47: the Assembly Station in the entrance hall, east side
position = [4.5, 0.0, 72.0]
yaw_deg = -90.0

[[spawn_point]]
name = "vault_chest"          # inside the vault (behind the door); step 35's chest
position = [0.0, 0.0, -18.0]
yaw_deg = 180.0

[[wave]]
id = "wing_gnawers"
delay_s = 1.0
enemies = [{ enemy = "gnawer", count = 2, at = "west_wing" }, { enemy = "gnawer", count = 2, at = "east_wing" }]

[[wave]]
id = "dais_heap"
delay_s = 3.0
enemies = [{ enemy = "heap", count = 1, at = "boss_dais" }, { enemy = "gnawer", count = 2, at = "west_wing" }]

# Step 34: the mini-boss, alone, as the last wave; its death opens the vault (Breach).
[[wave]]
id = "warden"
delay_s = 4.0
enemies = [{ enemy = "breach_warden", count = 1, at = "boss_dais" }]

