# Waves: crossing into the arena (feet within 4 m of its south half) starts them.
[waves]
trigger_center = [0.0, 0.0, 6.0]
trigger_radius = 4.0

[[spawn_point]]
name = "boss_dais"            # on the 0.2 m dais (under the 0.25 m nav climb); step 34's mini-boss stands here
position = [0.0, 0.2, -7.0]
yaw_deg = 180.0

[[spawn_point]]
name = "west_wing"
position = [-9.0, 0.0, 0.0]
yaw_deg = -90.0

[[spawn_point]]
name = "east_wing"
position = [9.0, 0.0, 0.0]
yaw_deg = 90.0

[[spawn_point]]
name = "vault_chest"          # inside the vault (behind the door); step 35's chest
position = [0.0, 0.0, -18.0]
yaw_deg = 180.0

[[wave]]
id = "wing_gnawers"
delay_s = 1.0
enemies = [{ enemy = "gnawer", count = 2, at = "west_wing" }, { enemy = "gnawer", count = 2, at = "east_wing" }]

[[wave]]
