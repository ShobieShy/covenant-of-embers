# 0.12.0 golden slice. Plaza, Main Gate, and the painted landmarks.
# Coordinates are docs/specs/TOWN_GOLDEN_SLICE_0.12.0.md. The live Town
# is unchanged. Hidden pads are collision only so the cobble stays flat.
# Every visible mesh is a Kenney, Quaternius, or Ember Art model.

[level]
id = "town_golden_slice"
name = "Eldoria - Town slice"
world_offset = [0.0, 0.0]

[materials]
ground = "assets/ambientcg/PavingStones131"
uv_scale = 0.4

[environment]
sky_color = [0.62, 0.66, 0.78]
ambient_color = [0.55, 0.48, 0.40]
fog_density = 0.0007
fog_light = [0.93, 0.86, 0.72]
sky = true
grade = [1.03, 1.05, 1.12]

[sun]
to_light = [0.55, 0.75, 0.25]
color = [1.0, 0.90, 0.72]

[player_start]
position = [-6.4, 2.0, 80.0]
yaw_deg = 0.0

[terrain]
size = [280, 280]
center = [20, 0]
height = 6
seed = 120
rim = 10
cliff = 4
blend = 16
spacing = 2
map_version = 1
pad_y = 1.95
foliage = 0
layers = ["grass", "path_cobble"]

[[box]]
name = "gate_pad"
kind = "ground"
hidden = true
center = [-6.4, 1.9, 50.0]
size = [16.0, 0.2, 100.0]
color = [0.4, 0.4, 0.4]
[[box]]
name = "plaza_pad"
