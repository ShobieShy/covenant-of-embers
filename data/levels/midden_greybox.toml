# Waves fire only in the bowl. Gnawers, then the flanks, then the Filth alone.
# north_ledge is the northernmost spawn; the road and the Breach gate are past it.
[waves]
trigger_center = [0.0, -2.0, -36.0]
trigger_radius = 7.0

[[spawn_point]]
name = "north_ledge"
position = [0.0, -2.0, -42.0]
yaw_deg = 180.0

[[spawn_point]]
