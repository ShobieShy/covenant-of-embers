# Dummies stand in the compactor, off the centre lane. They never chase.
# The Gnawer waits in the rot, north of the lesson walls, outside 8 m of the shrines.
# The Heap waits where the scrap climb meets the basin, before the bowl. Both are
# south of the Filth. Feet sit on a box top.
