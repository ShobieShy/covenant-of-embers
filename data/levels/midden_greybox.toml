# The Ashen Midden - greybox arena (old C++ BUILD_PLAN step 12; Godot BUILD_PLAN step 2).
# Source of truth for scenes/levels/midden.tscn: edit here, then run tools/toml_to_scene.py
# (tools/run_tests.sh fails while the scene is stale). Also read by scripts/world/level_toml.gd.
#
# Units: metres, degrees, linear RGB in [0, 1]. World: right-handed, +Y up, -Z north
# (the player starts facing north). Every [[box]] is the engine's unit cube scaled to
# `size`, rotated by `rotation_deg` = [x, y, z] Euler angles applied in Y, X, Z order
# (Godot's default, so Magewar transforms read the same), then moved to `center`.
# kind: ground | wall | ramp | crate | heap | platform. Unknown keys are errors.
#
# Layout reinterprets Magewar's landfill_tutorial (read-only reference): a dump floor
# with rotated trash piles, a 4 m high walled boss arena entered through a 4 m wide
# gap from the south, and a sickly, warm, foggy light. Ours is a 28 x 28 m square
# arena (Magewar: 26 m ring) with a scrap ledge + two ramps along the north wall,
# crate clusters for cover and the Midden's mound in the middle.

[level]
id = "midden_greybox"
name = "The Ashen Midden (greybox)"

[environment]
sky_color = [0.40, 0.35, 0.25]      # Magewar sky_horizon_color; also the clear colour
ambient_color = [0.28, 0.24, 0.16]  # Magewar ambient (0.35, 0.3, 0.2) hue, brighter (no GI/sky light here)
fog_density = 0.006                 # exp(-density * distance) toward sky_color (Magewar volumetric 0.02; lighter so the far wall still reads)

[sun]
to_light = [0.354, 0.707, 0.612]    # Magewar SicklyLight basis Z: high, slightly east, behind the player start
color = [0.85, 0.78, 0.57]          # Magewar light_color (0.6, 0.55, 0.4) hue

[player_start]                      # feet of the spawned player (the eye is 1.5 m above: Magewar body origin 0.8 + Neck 0.7)
position = [0.0, 0.0, 12.5]
yaw_deg = 0.0                       # facing north (-Z); pitch starts level

# --- ground + arena walls (4 m high like Magewar's ArenaWall_Ring) ---
[[box]]
name = "ground"
kind = "ground"
center = [0.0, -0.1, 0.0]
size = [40.0, 0.2, 40.0]
color = [0.36, 0.30, 0.22]

[[box]]
name = "wall_north"
kind = "wall"
center = [0.0, 2.0, -14.5]
size = [30.0, 4.0, 1.0]
color = [0.34, 0.34, 0.37]          # cool slate: reads against the warm sky

[[box]]
name = "wall_east"
kind = "wall"
center = [14.5, 2.0, 0.0]
size = [1.0, 4.0, 28.0]
color = [0.34, 0.34, 0.37]

[[box]]
name = "wall_west"
kind = "wall"
center = [-14.5, 2.0, 0.0]
size = [1.0, 4.0, 28.0]
color = [0.34, 0.34, 0.37]

# South wall split around a 4 m entrance (Magewar ArenaEntrance is 4 m wide).
[[box]]
name = "wall_south_west"
kind = "wall"
center = [-8.5, 2.0, 14.5]
size = [13.0, 4.0, 1.0]
color = [0.34, 0.34, 0.37]

[[box]]
name = "wall_south_east"
kind = "wall"
center = [8.5, 2.0, 14.5]
size = [13.0, 4.0, 1.0]
color = [0.34, 0.34, 0.37]

# --- scrap ledge along the north wall, 1.5 m up, two ramps from the south ---
[[box]]
name = "scrap_ledge"
kind = "platform"
center = [0.0, 0.75, -11.5]
size = [12.0, 1.5, 5.0]
color = [0.45, 0.40, 0.33]

# Ramps rise 1.5 m over 4 m of run (20.56 deg): top surface from (z -5, y 0) to (z -9, y 1.5).
[[box]]
name = "ramp_west"
kind = "ramp"
center = [-4.5, 0.61, -7.05]
size = [3.0, 0.3, 4.272]
rotation_deg = [20.556, 0.0, 0.0]
color = [0.58, 0.52, 0.36]

[[box]]
name = "ramp_east"
kind = "ramp"
center = [4.5, 0.61, -7.05]
size = [3.0, 0.3, 4.272]
rotation_deg = [20.556, 0.0, 0.0]
color = [0.58, 0.52, 0.36]

# --- the Midden's mound (boss spot) and trash heaps (Magewar TrashPiles, rotated about Y) ---
[[box]]
name = "midden_mound"
kind = "heap"
center = [0.0, 0.6, -1.5]
size = [3.0, 1.2, 3.0]
rotation_deg = [0.0, 45.0, 0.0]
color = [0.30, 0.33, 0.20]

[[box]]
name = "heap_west"
kind = "heap"
center = [-9.0, 0.9, -3.0]
size = [4.0, 1.8, 3.0]
rotation_deg = [0.0, 18.0, 0.0]
color = [0.30, 0.33, 0.20]

[[box]]
name = "heap_east"
kind = "heap"
center = [9.0, 1.2, 3.0]
size = [5.0, 2.4, 4.0]
rotation_deg = [0.0, -30.0, 0.0]
color = [0.30, 0.33, 0.20]

# --- crates (cover), Kenney crate proportions ---
[[box]]
name = "crate_w1"
kind = "crate"
center = [-7.0, 0.5, 5.0]
size = [1.0, 1.0, 1.0]
color = [0.62, 0.43, 0.22]

[[box]]
name = "crate_w2"
kind = "crate"
center = [-5.9, 0.5, 5.3]
size = [1.0, 1.0, 1.0]
rotation_deg = [0.0, 15.0, 0.0]
color = [0.62, 0.43, 0.22]

[[box]]
name = "crate_w3_stacked"
kind = "crate"
center = [-6.5, 1.5, 5.1]
size = [1.0, 1.0, 1.0]
rotation_deg = [0.0, 30.0, 0.0]
color = [0.66, 0.47, 0.25]

[[box]]
name = "crate_e_wide"
kind = "crate"
center = [5.5, 0.4, 7.0]
size = [2.0, 0.8, 1.0]
rotation_deg = [0.0, -20.0, 0.0]
color = [0.62, 0.43, 0.22]

[[box]]
name = "crate_ne"
kind = "crate"
center = [10.0, 0.6, -6.0]
size = [1.2, 1.2, 1.2]
rotation_deg = [0.0, 10.0, 0.0]
color = [0.62, 0.43, 0.22]

# Training dummies (step 11): [[enemy]] = an enemy id from data/enemies/*.toml, its feet
# `position` (must lie on a box surface), optional `yaw_deg` and optional `respawn_s`
# (step 14: the spawner revives it at full health that long after a death). Placed off the south
# lane so the walk-and-cast smoke test still reaches the north wall.
[[enemy]]
enemy = "earth_training_dummy"
position = [-3.0, 0.0, 6.0]
yaw_deg = 20.0
respawn_s = 3.0

[[enemy]]
enemy = "water_training_dummy"
position = [4.0, 0.0, 4.0]
yaw_deg = -20.0
respawn_s = 3.0

# Step 12: a Gnawer (data/enemies/gnawer.toml) idling in the north-west corner, beyond its
# 8 m detect range from the start and the scripted walk, so the smoke tests stay as they
# were; wander over (or shoot it) and it rushes you.
[[enemy]]
enemy = "gnawer"
position = [-11.0, 0.0, -11.0]
yaw_deg = -135.0   # facing the arena centre

# Step 13: a Heap (data/enemies/heap.toml) in the north-east corner, mirroring the Gnawer:
# beyond its 10 m detect range from the start and the scripted walk. Its glowing seam faces
# the north-east wall; flank it.
[[enemy]]
enemy = "heap"
position = [11.0, 0.0, -11.0]
yaw_deg = 135.0    # facing the arena centre

# Step 14: waves. Walking onto the midden mound (feet within trigger_radius of
# trigger_center) starts them; each [[wave]] spawns delay_s after the previous one is
# cleared (the first: delay_s after the trigger). `enemies` = [{ enemy, count, at }]:
# `count` of an enemy id from data/enemies at a [[spawn_point]] (several stand on a 1.5 m
# ring around it; every ring spot must lie on a box surface). Wave enemies are freed
# after death; they don't respawn. The start, the scripted smoke walk and the corner
# enemies stay outside the trigger, so the existing smoke tests are unchanged.
[waves]
trigger_center = [0.0, 0.0, -1.5]
trigger_radius = 4.0

[[spawn_point]]
name = "north_ledge"          # on the scrap ledge: they pour down the ramps
position = [0.0, 1.5, -11.5]
yaw_deg = 180.0

[[spawn_point]]
name = "west_flank"
position = [-11.5, 0.0, 9.0]
yaw_deg = -90.0

[[spawn_point]]
name = "east_flank"
position = [11.5, 0.0, 9.0]
yaw_deg = 90.0

[[wave]]
id = "gnawer_pack"
delay_s = 1.0
enemies = [{ enemy = "gnawer", count = 3, at = "north_ledge" }]

[[wave]]
id = "flank"
delay_s = 3.0
enemies = [{ enemy = "gnawer", count = 2, at = "west_flank" }, { enemy = "gnawer", count = 2, at = "east_flank" }]

[[wave]]
id = "heap_push"
delay_s = 3.0
enemies = [{ enemy = "heap", count = 1, at = "north_ledge" }, { enemy = "gnawer", count = 2, at = "north_ledge" }]
