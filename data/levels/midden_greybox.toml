# The Landfill (formerly "The Ashen Midden", Q25) - greybox arena (old C++ BUILD_PLAN step 12; Godot BUILD_PLAN step 2).
# Source of truth for scenes/levels/midden.tscn: edit here, then run tools/toml_to_scene.py
# (tools/run_tests.sh fails while the scene is stale). Also read by scripts/world/level_toml.gd.
#
# Units: metres, degrees, linear RGB in [0, 1]. World: right-handed, +Y up, -Z north
# (the player starts facing north). Every [[box]] is the engine's unit cube scaled to
# `size`, rotated by `rotation_deg` = [x, y, z] Euler angles applied in Y, X, Z order
# (Godot's default, so Magewar transforms read the same), then moved to `center`.
# kind: ground | wall | ramp | crate | heap | platform. Unknown keys are errors.
#
# Layout: a closed linear valley, south to north (-Z). The player comes in from town
# at the south lip and walks a sunken trash trench: entry dump, compactor, deeper rot
# (scrap climb included), the Filth bowl, then an empty north road into the Breach.
# The Filth is the last encounter. Nothing past that bowl fights back.
# Tutorial beats still stand on the upper floor (yard z 10.5, Joe z ~7.5, shrines z 4,
# soft walls at z 9 / 5.5 / 2.5). The scrap ledge and its south ramps are unchanged
# so the ramp walk still climbs onto them; north ramps drop back to the trench.

[level]
id = "midden_greybox"
name = "The Landfill"
world_offset = [576.0, -240.0]  # OW1: docs/WORLD_LAYOUT.md

[materials]                  # step 75 art pass: CC0 ambientCG sets, tinted by each box colour
ground = "assets/ambientcg/Ground037"
heap = "assets/ambientcg/Ground037"
wall = "assets/ambientcg/Rock030"
crate = "assets/ambientcg/Wood049"
platform = "assets/ambientcg/Metal032"
ramp = "assets/ambientcg/Metal032"
uv_scale = 0.4

[environment]
sky_color = [0.40, 0.35, 0.25]      # Magewar sky_horizon_color; also the clear colour
ambient_color = [0.28, 0.24, 0.16]  # Magewar ambient (0.35, 0.3, 0.2) hue, brighter (no GI/sky light here)
fog_density = 0.006                 # exp(-density * distance) toward sky_color (Magewar volumetric 0.02; lighter so the far wall still reads)
sky = true                          # step 124 (Art A6): procedural sky
volumetric_fog = 0.03                # step 132 (FX F6): green-brown Landfill haze (off on Low)
fog_albedo = [0.55, 0.6, 0.35]
grade = [1.0, 1.08, 0.92]          # step 132: brightness, contrast, saturation

[sun]
to_light = [0.354, 0.707, 0.612]    # Magewar SicklyLight basis Z: high, slightly east, behind the player start
color = [0.85, 0.78, 0.57]          # Magewar light_color (0.6, 0.55, 0.4) hue

[player_start]                      # feet of the spawned player (the eye is 1.5 m above: Magewar body origin 0.8 + Neck 0.7)
position = [0.0, 0.0, 12.5]
yaw_deg = 0.0                       # facing north (-Z); pitch starts level

