# Labyrinth Act II, The Blightcoil (PLAN_0.7.0_ACT2.md). One cavern, not a FloorGen floor.
# Sump walking surface y = 0, Canopy y = 12, Crown y = 24. The Rotheart is a solid
# column. Root-bridge ramps join the slabs; each ramp's horizontal run is at least 20 m.
# The pads sit on the painting's three bands: poison lobes on the Sump, the shrine
# on the Canopy front, the Matriarch on the west Crown shelf.

[cavern]
id = "blightcoil"
sump_y = 0.0
canopy_y = 12.0
crown_y = 24.0
trunk_radius = 4.0
trunk_top = 28.0
outer_radius = 33.0
inner_open = 8.0
ramp_width = 8.0
ramp_thickness = 0.35
void_y = -8.0
fog_y = 12.0
rest_exempt = 2.5
boss = "blightmaw_matriarch"

[[slab]]
id = "sump"
checkpoint = 6
waystone = "blightcoil_sump"
center = [0.0, 0.0, 8.0]
size = [56.0, 44.0]
pad = [6.0, 0.0, 14.0]

[[slab]]
id = "canopy"
checkpoint = 7
waystone = "blightcoil_canopy"
center = [2.0, 12.0, 11.0]
size = [28.0, 16.0]
pad = [2.0, 12.0, 12.0]

[[slab]]
id = "crown"
checkpoint = 8
waystone = "blightcoil_crown"
center = [-16.0, 24.0, -10.0]
size = [18.0, 14.0]
pad = [-16.0, 24.0, -11.0]

# Each ramp leaves the near edge of its slab and lands on the next, so the
# rising span is not a ceiling over the pad it just left.
[[ramp]]
id = "to_canopy"
fr = [-20.0, 0.0, 24.0]
to = [-4.0, 12.0, 8.0]
lip = [-2.0, 12.0, 10.0]

[[ramp]]
id = "to_crown"
fr = [-2.0, 12.0, 15.0]
to = [-18.0, 24.0, -6.0]
lip = [-17.0, 24.0, -9.0]

[[deck]]
id = "canopy_west"
center = [-19.0, 12.0, 2.0]
size = [10.0, 16.0]

[[deck]]
id = "canopy_link"
center = [-11.0, 12.0, -4.0]
size = [12.0, 6.0]

[[deck]]
id = "canopy_east"
center = [20.0, 12.0, 8.0]
size = [12.0, 16.0]

[[deck]]
id = "crown_east"
center = [16.0, 24.0, -4.0]
size = [16.0, 20.0]

[[deck]]
id = "crown_bridge"
center = [-2.0, 24.0, -12.0]
size = [14.0, 6.0]

[[deck]]
id = "crown_west_lip"
center = [-30.0, 24.0, -8.0]
size = [10.0, 12.0]

[[pocket]]
id = "sump_pocket"
at = [18.0, 0.0, 16.0]
size = [4.0, 4.0]
secret = true

[[pocket]]
id = "canopy_pocket"
at = [8.0, 12.0, 10.0]
size = [3.5, 4.0]
