# Base staffs and wands (BUILD_PLAN step 17, PLAN §30.1) -- Magewar's four bases.
# Values from Magewar magewar/resources/items/{staffs,wands}/*.tres + staff_wieldable_item.gd
# (read-only reference). A base staff/wand *is* the spell; parts (step 28) modify it.
#
# Keys (all required, unknown keys are an error):
#   id                lower_snake_case key
#   name              display name
#   type              "staff" | "wand"
#   base_rarity       basic | uncommon | rare | mythic | primordial | unique
#                     (damage x 1.0 / 1.25 / 1.5 / 2.0 / 2.75 / 3.0)
#   element           arcane | fire | water | earth | air | light | dark
#                     (Magewar's NONE element is "arcane")
#   damage            base damage per hit, before rarity and parts (0.1..1000)
#   mana_cost         mana per cast, spent from step 18 (0..100)
#   cooldown          seconds between casts, >= 0.1 (Magewar's fire-rate floor)
#   projectile_speed  m/s (1..500)
#   range             metres the bolt flies before it fizzles (1..1000)

